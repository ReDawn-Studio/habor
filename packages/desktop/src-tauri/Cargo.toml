[package]
name = "habor-desktop"
version = "0.6.0"
description = "habor desktop workspace"
authors = ["ReDawn Studio"]
edition = "2021"

[lib]
name = "habor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
